[project]
name = "mke-service-equity-data"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.14.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/data"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
