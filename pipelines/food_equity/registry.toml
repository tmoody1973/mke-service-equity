[[metrics]]
slug = "sram_snap_low_access_share_1mi"
name = "Population beyond one driving mile from any SNAP-authorized retailer"
treatment = "scoring"
domain = "retail_access"
source = "sram"
source_fields = ["CensusTract20", "DD_SRAM_lapop1", "DD_SRAM_lapop1share"]
unit = "percent"
higher_is_worse = true
weight = "0.5"

[[metrics]]
slug = "full_service_grocery_walk_access"
name = "Walking-network access to nearest full-service grocery"
treatment = "scoring"
domain = "retail_access"
source = "snap_retailers"
source_fields = ["Record ID", "Store Type", "Latitude", "Longitude", "Authorization Date", "End Date"]
unit = "ordered_reachability_and_minutes"
higher_is_worse = true
weight = "0.5"

[[metrics]]
slug = "households_no_vehicle"
name = "Households with no vehicle available"
treatment = "scoring"
domain = "transportation_constraint"
source = "acs_vehicle"
source_fields = ["B08201_001E", "B08201_001M", "B08201_002E", "B08201_002M"]
unit = "percent"
higher_is_worse = true
weight = "0.5"

[[metrics]]
slug = "scheduled_transit_service_intensity"
name = "Scheduled transit service reachable within a ten-minute walk"
treatment = "scoring"
domain = "transportation_constraint"
source = "mcts_gtfs"
source_fields = ["stops.txt", "trips.txt", "stop_times.txt", "calendar.txt", "calendar_dates.txt"]
unit = "unique_trips_per_hour"
higher_is_worse = false
weight = "0.5"

[[metrics]]
slug = "full_service_grocery_counts_context"
name = "Full-service grocery counts within walking thresholds"
treatment = "contextual"
source = "snap_retailers"
source_fields = ["Record ID", "Store Type", "Latitude", "Longitude"]
unit = "count"
higher_is_worse = false

[[metrics]]
slug = "emergency_food_access_context"
name = "Emergency-food resources and walking access"
treatment = "contextual"
source = "emergency_food_context"
source_fields = ["ObjectID", "USER_Type", "USER_Notes", "geometry"]
unit = "count_and_quality_state"
higher_is_worse = false

