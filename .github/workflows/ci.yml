name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "tarikjmoody/**"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned MobilityData GTFS Validator
        run: |
          mkdir -p .tools
          curl --fail --location --show-error --silent \
            https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar \
            --output .tools/gtfs-validator-8.0.1-cli.jar
          echo "19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2  .tools/gtfs-validator-8.0.1-cli.jar" \
            | sha256sum --check --strict
          echo "MKE_GTFS_VALIDATOR_JAR=$GITHUB_WORKSPACE/.tools/gtfs-validator-8.0.1-cli.jar" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - run: uv run ruff check pipelines tests/data
      - run: uv run ruff format --check pipelines tests/data
      - run: uv run mypy pipelines
      - run: uv run pytest tests/data -q
